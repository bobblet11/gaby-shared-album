services:
  nginx:
    image: ghcr.io/${GITHUB_REPO}/frontend:${GITHUB_SHA}
    container_name: nginx
    ports:
      - "80:80"
    env_file:
      - ${PROJECT_PATH}/frontend/.env.production
    volumes:
      - ${EXTERNAL_STATIC_MEDIA_PATH}:${INTERNAL_STATIC_MEDIA_PATH}
    hostname: nginx

  # change db code to contact postgres CONTAINER, not localhost!
  # db:5432
  # postgres://DB_USER:DB_PASS@db:5432/DB_NAME
  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    hostname: ${DB_HOST}

  backend:
    container_name: backend
    image: ghcr.io/${GITHUB_REPO}/backend:${GITHUB_SHA}
    # command: tail -f 
    ports:
      - "${API_PORT}:5000"
    env_file:
      - ${PROJECT_PATH}/backend/.env.production

    volumes:
      - ${EXTERNAL_STATIC_MEDIA_PATH}:${INTERNAL_STATIC_MEDIA_PATH}
    
    hostname: ${API_HOST}


  graphite:
    image: hopsoft/graphite-statsd
    container_name: graphite
    restart: always
    ports:
      - "${GRAPHITE_PORT_UI}:3000"       # Grafana UI
      - "${GRAPHITE_PORT_WEB_UI}:81"       # Graphite Web UI
      - "${GRAPHITE_PORT_INGEST}:8125/udp" # StatsD UDP ingestion
      - "${GRAPHITE_PORT_ADMIN}:8126"   # StatsD admin
      - "${GRAPHITE_PORT_CARBON}:2003"   # StatsD admin
    volumes:
      - graphite_data:/opt/graphite/storage
    hostname: ${GRAPHITE_HOST}
  
volumes:
  postgres_data:
  graphite_data:
