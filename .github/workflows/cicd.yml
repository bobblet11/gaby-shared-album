# cicd.yaml

name: Deploy

on:
        push:
                branches:
                        - main
                        - CICD-runs                        
permissions:
        contents: read
        packages: write
        
jobs:
        lint-ci-build-upload:
                environment: prod
                runs-on: ubuntu-latest
                steps:
                        - name: Checkout repo
                          uses: actions/checkout@v4

                        - name: Create nginx config
                          run: |
                                        export DB_HOST="${{ vars.DB_HOST }}"
                                        export DB_PORT="${{ vars.DB_PORT }}"
                                          
                                        export API_PORT="${{ vars.API_PORT }}"
                                        export API_HOST="${{ vars.API_HOST }}"

                                        export GRAPHITE_HOST="${{ vars.GRAPHITE_HOST }}"
                                        export GRAPHITE_PORT_UI="${{ vars.GRAPHITE_PORT_UI }}"
                                        export GRAPHITE_PORT_WEB_UI="${{ vars.GRAPHITE_PORT_WEB_UI }}"
                                        export GRAPHITE_PORT_INGEST="${{ vars.GRAPHITE_PORT_INGEST }}"
                                        export GRAPHITE_PORT_ADMIN="${{ vars.GRAPHITE_PORT_ADMIN }}"

                                        export INTERNAL_STATIC_MEDIA_PATH="${{ vars.INTERNAL_STATIC_MEDIA_PATH }}"
                                        : "${INTERNAL_STATIC_MEDIA_PATH:=/usr/src/app/uploads}"

                                        sudo cat > ./infra/nginx/frontend.conf <<EOF
                                        server {
                                                listen 80;
                                                listen [::]:80;
                                                client_max_body_size 50M;

                                                server_name _;

                                                # Serve media uploads FIRST
                                                location /media/ {
                                                        alias ${INTERNAL_STATIC_MEDIA_PATH}/;
                                                        autoindex off;
                                                }

                                                # Serve React frontend
                                                location / {
                                                        root /usr/share/nginx/html;
                                                        index index.html;
                                                        try_files \$uri /index.html;
                                                }

                                                # Forward API requests
                                                location /api/ {
                                                        proxy_pass http://${API_HOST}:${API_PORT};
                                                        proxy_set_header Host \$host;
                                                        proxy_set_header X-Real-IP \$remote_addr;
                                                        proxy_request_buffering off;
                                                        proxy_read_timeout 300;
                                                }

                                                # Grafana UI (3000)
                                                location /grafana/ {
                                                        proxy_pass http://${GRAPHITE_HOST}:${GRAPHITE_PORT_UI}/;
                                                        proxy_set_header Host $host;
                                                        proxy_set_header X-Real-IP $remote_addr;
                                                }

                                                # Graphite Web UI (81)
                                                location /graphite/ {
                                                        proxy_pass http://${GRAPHITE_HOST}:${GRAPHITE_PORT_WEB_UI}/;
                                                        proxy_set_header Host $host;
                                                        proxy_set_header X-Real-IP $remote_addr;
                                                }


                                        }
                                        EOF

                        - name: Install lint
                          run: |
                                npm install --only=dev

                        - name: Lint project
                          run: npm run lint

                        - name: Build frontend Docker image
                          run: |
                                set -euo pipefail
                                
                                docker build \
                                --build-arg REACT_APP_API_URL=${{ vars.PUBLIC_API_DOMAIN }} \
                                --build-arg REACT_APP_FEATURE_FLAG=${{ vars.REACT_APP_FEATURE_FLAG }} \
                                --build-arg REACT_APP_MAX_FILES_PER_UPLOAD=${{ vars.REACT_APP_MAX_FILES_PER_UPLOAD }} \
                                -t ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} \
                                -f infra/docker/frontend/Dockerfile .

                        - name: Build backend Docker image
                          run: |
                                set -euo pipefail

                                docker build \
                                -t ghcr.io/${{ github.repository }}/backend:${{ github.sha }} \
                                -f infra/docker/backend/Dockerfile .

                        - name: Push frontend Docker image
                          run: |
                                set -euo pipefail
                                echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
                                docker push ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

                        - name: Push backend Docker image
                          run: |
                                set -euo pipefail
                                echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
                                docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

        prep-download-deploy:
                runs-on: ubuntu-latest
                environment: prod
                needs: lint-ci-build-upload
                steps:

                        - name: Ensure all folders & files & dependencies exist
                          uses: appleboy/ssh-action@v0.1.10
                          with:
                                host: ${{ secrets.TARGET_HOST }}
                                username: ${{ secrets.TARGET_USER }}
                                key: ${{ secrets.SSH_PRIVATE_KEY }}
                                port: ${{ secrets.TARGET_PORT }}

                                proxy_host: ${{ secrets.GATEWAY_HOST }}
                                proxy_port: ${{ secrets.GATEWAY_PORT }}
                                proxy_username: ${{ secrets.GATEWAY_USER }}
                                proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
                                script: |
                                        echo "----------------------------------------------" 
                                        set -euo pipefail
                                        echo "Creating volume folders..."  
                                        
                                        export EXTERNAL_STATIC_MEDIA_PATH="/var/www/${{ github.event.repository.name }}/uploads"
                                        export DOWN_SCALE_IMAGE_FOLDER_NAME="${{ vars.DOWN_SCALE_IMAGE_FOLDER_NAME }}"
                                        export FULL_SCALE_IMAGE_FOLDER_NAME="${{ vars.FULL_SCALE_IMAGE_FOLDER_NAME}}"
                                        export ORIGINAL_SCALE_IMAGE_FOLDER_NAME="${{ vars.ORIGINAL_SCALE_IMAGE_FOLDER_NAME }}"
                                        export TEMP_SCALE_IMAGE_FOLDER_NAME="${{ vars.TEMP_SCALE_IMAGE_FOLDER_NAME }}"   
                                        export PROJECT_PATH=/srv/${{ github.event.repository.name }}

                                        # volumes
                                        sudo mkdir -p "${EXTERNAL_STATIC_MEDIA_PATH}"
                                        sudo mkdir -p "${EXTERNAL_STATIC_MEDIA_PATH}/${DOWN_SCALE_IMAGE_FOLDER_NAME}"
                                        sudo mkdir -p "${EXTERNAL_STATIC_MEDIA_PATH}/${FULL_SCALE_IMAGE_FOLDER_NAME}"
                                        sudo mkdir -p "${EXTERNAL_STATIC_MEDIA_PATH}/${ORIGINAL_SCALE_IMAGE_FOLDER_NAME}"
                                        sudo mkdir -p "${EXTERNAL_STATIC_MEDIA_PATH}/${TEMP_SCALE_IMAGE_FOLDER_NAME}"

                                        sudo mkdir -p "${PROJECT_PATH}"
                                        # for the upload volume
                                        sudo chown -R "$USER:$USER" "/var/www/${{ github.event.repository.name }}"

                                        # for the project files
                                        sudo chown -R "$USER:$USER" "${PROJECT_PATH}"

                                        echo "External media folders generated..."

                                        # repo
                                        echo "----------------------------------------------" 
                                        echo "Pulling latest code..."   
                                        export REPO_OWNER="${{ github.repository_owner }}"
                                        export GITHUB_ACTOR="${{github.actor}}"
                                        export ACCOUNT_TOKEN="${{ secrets.ACCOUNT_TOKEN }}"
                                        export BRANCH="${{ github.ref_name }}"
                                        

                                        if [ ! -d "${PROJECT_PATH}/.git" ]; then
                                                echo "Cloning repo..."
                                                git clone --branch "$BRANCH" "https://${GITHUB_ACTOR}:${ACCOUNT_TOKEN}@github.com/${REPO_OWNER}/${REPO_NAME}.git" "$PROJECT_PATH"
                                        else
                                                echo "Updating repo..."
                                                cd "$PROJECT_PATH"
                                                git fetch origin "$BRANCH"
                                                git reset --hard "origin/$BRANCH"
                                        fi

                                        echo "----------------------------------------------" 
                                        echo "Installing Docker..."

                                        if ! command -v docker >/dev/null 2>&1; then
                                                echo "Docker not found, installing..."
                                                sudo apt-get update -y
                                                sudo apt-get install -y docker.io docker-compose-v2
                                                sudo systemctl enable --now docker
                                        else
                                                echo "Docker already installed: $(docker --version)"
                                        fi

                                        if ! sudo docker compose version >/dev/null 2>&1; then
                                                echo "Docker Compose not found, installing..."
        
                                                sudo apt-get update -y
                                                sudo apt-get install -y docker-compose-v2
                                        fi

                                        sudo docker compose version
                                        echo "Docker installed."  
                                        echo "----------------------------------------------" 

                        
                        - name: Delete old builds
                          uses: appleboy/ssh-action@v0.1.10
                          with:
                                  host: ${{ secrets.TARGET_HOST }}
                                  username: ${{ secrets.TARGET_USER }}
                                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                                  port: ${{ secrets.TARGET_PORT }}

                                  proxy_host: ${{ secrets.GATEWAY_HOST }}
                                  proxy_port: ${{ secrets.GATEWAY_PORT }}
                                  proxy_username: ${{ secrets.GATEWAY_USER }}
                                  proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
                                  script: |
                                          set -euo pipefail
                                          echo "----------------------------------------------"
                                          echo "Deleting old builds..."
                                          # Remove all containers
                                          sudo docker rm -f $(sudo docker ps -aq) || true

                                          # Remove all images
                                          sudo docker rmi -f $(sudo docker images -q) || true

                                          # Prune unused volumes and networks
                                          sudo docker system prune -af
                                          echo "Deleted old builds..."

                        - name: Download new builds
                          uses: appleboy/ssh-action@v0.1.10
                          with:
                                  host: ${{ secrets.TARGET_HOST }}
                                  username: ${{ secrets.TARGET_USER }}
                                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                                  port: ${{ secrets.TARGET_PORT }}

                                  proxy_host: ${{ secrets.GATEWAY_HOST }}
                                  proxy_port: ${{ secrets.GATEWAY_PORT }}
                                  proxy_username: ${{ secrets.GATEWAY_USER }}
                                  proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
                                  script: |
                                          set -euo pipefail
                                          echo "----------------------------------------------"

                                          
                                          echo "Downloading docker images..."
                                          echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
                                          sudo docker pull ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
                                          sudo docker pull ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

                        - name: Deploy
                          uses: appleboy/ssh-action@v0.1.10
                          with:
                                  host: ${{ secrets.TARGET_HOST }}
                                  username: ${{ secrets.TARGET_USER }}
                                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                                  port: ${{ secrets.TARGET_PORT }}

                                  proxy_host: ${{ secrets.GATEWAY_HOST }}
                                  proxy_port: ${{ secrets.GATEWAY_PORT }}
                                  proxy_username: ${{ secrets.GATEWAY_USER }}
                                  proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
                                  script: |
                                          set -euo pipefail
                                          echo "----------------------------------------------"
                                          echo "Exporting environment variables..."
                                          
                                          export PROJECT_PATH=/srv/${{ github.event.repository.name }}
                                          export BACKEND_ENV_PATH="${PROJECT_PATH}/backend/.env.production"
                                          export FRONTEND_ENV_PATH="${PROJECT_PATH}/frontend/.env.production"
                                          export DOCKER_ENV_PATH="${PROJECT_PATH}/infra/docker/.env"

                                          export DB_USER="${{ secrets.DB_USER }}"
                                          export DB_PASS="${{ secrets.DB_PASS }}"
                                          export DB_NAME="${{ vars.DB_NAME }}"
                                          export DB_HOST="${{ vars.DB_HOST }}"
                                          export DB_PORT="${{ vars.DB_PORT }}"

                                          export API_PORT="${{ vars.API_PORT }}"
                                          export API_HOST="${{ vars.API_HOST }}"

                                          export GRAPHITE_HOST="${{ vars.GRAPHITE_HOST }}"
                                          export GRAPHITE_PORT_UI="${{ vars.GRAPHITE_PORT_UI }}"
                                          export GRAPHITE_PORT_WEB_UI="${{ vars.GRAPHITE_PORT_WEB_UI }}"
                                          export GRAPHITE_PORT_INGEST="${{ vars.GRAPHITE_PORT_INGEST }}"
                                          export GRAPHITE_PORT_ADMIN="${{ vars.GRAPHITE_PORT_ADMIN }}"
                                          export GRAPHITE_PORT_CARBON="${{ vars.GRAPHITE_PORT_CARBON}}"
                                          
                                          # volumes will map uploads to the external media path
                                          export EXTERNAL_STATIC_MEDIA_PATH="/var/www/${{ github.event.repository.name }}/uploads"
                                          export INTERNAL_STATIC_MEDIA_PATH="${{ vars.INTERNAL_STATIC_MEDIA_PATH }}"
                                          : "${INTERNAL_STATIC_MEDIA_PATH:=/usr/src/app/uploads}"


                                          export REACT_APP_FEATURE_FLAG="${{ vars.REACT_APP_FEATURE_FLAG }}"
                                          export REACT_APP_MAX_FILES_PER_UPLOAD="${{ vars.REACT_APP_MAX_FILES_PER_UPLOAD }}"
                                          echo "Environment variables exported.\n\n"
                                          


                                          echo "----------------------------------------------"
                                          echo "Generating .env files..."
                                          sudo mkdir -p "$(dirname "$BACKEND_ENV_PATH")"
                                          sudo touch "$BACKEND_ENV_PATH"

                                          sudo mkdir -p "$(dirname "$FRONTEND_ENV_PATH")"
                                          sudo touch "$FRONTEND_ENV_PATH"

                                          sudo mkdir -p "$(dirname "$DOCKER_ENV_PATH")"
                                          sudo touch "$DOCKER_ENV_PATH"

                                          sudo chown "$USER:$USER" "${BACKEND_ENV_PATH}"
                                          sudo chown "$USER:$USER" "${FRONTEND_ENV_PATH}"
                                          sudo chown "$USER:$USER" "${DOCKER_ENV_PATH}"
                                          

                                          sudo cat > ${BACKEND_ENV_PATH} <<EOF
                                          API_HOST=$API_HOST
                                          API_PORT=$API_PORT
                                          DB_USER=$DB_USER
                                          DB_PASS=$DB_PASS
                                          DB_NAME=$DB_NAME
                                          DB_HOST=$DB_HOST
                                          DB_PORT=$DB_PORT
                                          GRAPHITE_HOST=$GRAPHITE_HOST
                                          GRAPHITE_PORT_INGEST=$GRAPHITE_PORT_INGEST
                                          PUBLIC_API_DOMAIN=${{ vars.PUBLIC_API_DOMAIN }}
                                          BASE_MEDIA_PATH=$INTERNAL_STATIC_MEDIA_PATH
                                          DOWN_SCALE_IMAGE_FOLDER_NAME="${{ vars.DOWN_SCALE_IMAGE_FOLDER_NAME }}"
                                          FULL_SCALE_IMAGE_FOLDER_NAME="${{ vars.FULL_SCALE_IMAGE_FOLDER_NAME }}"
                                          ORIGINAL_SCALE_IMAGE_FOLDER_NAME="${{ vars.ORIGINAL_SCALE_IMAGE_FOLDER_NAME }}"
                                          TEMP_SCALE_IMAGE_FOLDER_NAME="${{ vars.TEMP_SCALE_IMAGE_FOLDER_NAME }}"
                                          EOF


                                          sudo cat > ${FRONTEND_ENV_PATH} <<EOF
                                          REACT_APP_API_URL=${{ vars.PUBLIC_API_DOMAIN }}
                                          REACT_APP_FEATURE_FLAG=$REACT_APP_FEATURE_FLAG
                                          REACT_APP_MAX_FILES_PER_UPLOAD=$REACT_APP_MAX_FILES_PER_UPLOAD
                                          EOF

                                          sudo cat > ${DOCKER_ENV_PATH} <<EOF
                                          PROJECT_PATH=${PROJECT_PATH}
                                          GITHUB_REPO=${{ github.repository }}
                                          GITHUB_SHA=${{ github.sha }}
                                          API_PORT=${API_PORT}
                                          EXTERNAL_STATIC_MEDIA_PATH=${EXTERNAL_STATIC_MEDIA_PATH}
                                          INTERNAL_STATIC_MEDIA_PATH=${INTERNAL_STATIC_MEDIA_PATH}
                                          API_HOST=$API_HOST
                                          API_PORT=$API_PORT
                                          DB_USER=$DB_USER
                                          DB_PASS=$DB_PASS
                                          DB_NAME=$DB_NAME
                                          DB_HOST=$DB_HOST
                                          DB_PORT=$DB_PORT
                                          GRAPHITE_HOST=$GRAPHITE_HOST
                                          GRAPHITE_PORT_UI=$GRAPHITE_PORT_UI
                                          GRAPHITE_PORT_WEB_UI=$GRAPHITE_PORT_WEB_UI
                                          GRAPHITE_PORT_INGEST=$GRAPHITE_PORT_INGEST
                                          GRAPHITE_PORT_CARBON=$GRAPHITE_PORT_CARBON
                                          GRAPHITE_PORT_ADMIN=$GRAPHITE_PORT_ADMIN
                                          EOF

                                          echo "Generated .env files...\n\n"


                                          echo "----------------------------------------------"
                                          echo "Deploying Docker Containers..."
                                          echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
                                          sudo docker compose -f "${PROJECT_PATH}/infra/docker/docker-compose.yml" --env-file "${DOCKER_ENV_PATH}" up -d

                                          echo "Running migrations..."
                                          sudo docker compose -f "${PROJECT_PATH}/infra/docker/docker-compose.yml" exec backend npm run migrate:up

                                          echo "Containers deployed...\n\n"
                                          echo "----------------------------------------------"

                        - name: Install and run system metric daemon (collectd)
                          uses: appleboy/ssh-action@v0.1.10
                          with:
                                  host: ${{ secrets.TARGET_HOST }}
                                  username: ${{ secrets.TARGET_USER }}
                                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                                  port: ${{ secrets.TARGET_PORT }}

                                  proxy_host: ${{ secrets.GATEWAY_HOST }}
                                  proxy_port: ${{ secrets.GATEWAY_PORT }}
                                  proxy_username: ${{ secrets.GATEWAY_USER }}
                                  proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
                                  script: |
                                        set -euo pipefail
                                        echo "----------------------------------------------"
                                        export GRAPHITE_HOST="${{ vars.GRAPHITE_HOST }}"
                                        export GRAPHITE_PORT_CARBON="${{ vars.GRAPHITE_PORT_CARBON }}"

                                        if ! command -v collectd -v >/dev/null 2>&1; then
                                                echo "collectd not found, installing..."
                                                sudo apt-get update -y
                                                sudo apt-get install -y collectd
                                                sudo systemctl enable --now collectd
                                        else
                                                echo "collectd already installed: $(docker --version)"
                                        fi
                                        
                                        echo "----------------------------------------------"
                                        echo "Ensuring config exists for collectd"

                                        echo "----------------------------------------------"
                                        echo "Configuring collectd..."
                                        sudo mkdir -p /etc/collectd
                                        
                                        sudo tee /etc/collectd/collectd.conf > /dev/null <<'EOF'
                                        LoadPlugin cpu
                                        LoadPlugin memory
                                        LoadPlugin disk
                                        LoadPlugin network

                                        <Plugin write_graphite>
                                        <Node "graphite">
                                          Host "${GRAPHITE_HOST}"
                                          Port "${GRAPHITE_PORT_CARBON}"
                                          Protocol "tcp"
                                          Prefix "system."
                                        </Node>
                                        </Plugin>
                                        EOF

                                        echo "----------------------------------------------"
                                        echo "Testing collectd config..."
                                        sudo collectd -t

                                        echo "----------------------------------------------"
                                        echo "Restarting collectd..."
                                        sudo systemctl restart collectd
                                        sudo systemctl status collectd --no-pager



